<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Background — Phat T. Tran-Truong</title>
    <!-- About merged into the homepage; this page only forwards old links. -->
    <meta name="robots" content="noindex" />
    <link rel="canonical" href="https://leotttphat.github.io/" />
    <script>
      (function () {
        // Keep deep links: about/#awards lands on the homepage's #awards.
        var sections = ["education", "experience", "awards", "skills"];
        var hash = window.location.hash.slice(1);
        var target = sections.indexOf(hash) >= 0 ? hash : "background";
        window.location.replace("../#" + target);
      })();
    </script>
    <meta http-equiv="refresh" content="0; url=../#background" />
  </head>
  <body>
    <p>
      Background, education, experience, and awards are now on the
      <a href="../#background">homepage</a>.
    </p>
  </body>
</html>
